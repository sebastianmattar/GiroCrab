name: Android Build

on:
  push:
    branches: [ feat/android-parity ]
    paths:
      - 'GiroCrabAndroid/**'
      - 'girocrab-core/**'
      - 'uniffi-bindgen/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rust core for Android: cross-compiled with cargo-ndk into jniLibs, UniFFI Kotlin bindings
      # into src/main/generated (see GiroCrabAndroid/scripts/build-rust-android.sh).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # Only main writes the cache; PRs restore it (same rule as ci.yml).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Build Rust core and UniFFI bindings
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          # openssl-src (vendored SQLCipher) needs the NDK clang on PATH
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          GiroCrabAndroid/scripts/build-rust-android.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest ships the Android SDK; skip setup-android (its sdkmanager step failed) and just accept licenses.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: GiroCrabAndroid
        run: gradle assembleDebug --console=plain --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GiroCrab-Android-debug-apk
          path: GiroCrabAndroid/app/build/outputs/apk/debug/*.apk
