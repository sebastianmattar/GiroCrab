name: Release

# macOS release artifacts are NOT built or uploaded by CI.
# Signing (Developer ID), notarization and stapling happen 100% locally on the
# maintainer's Mac (keychain identity + `notary-profile`), deliberately without
# Apple certificates in GitHub Secrets:
#
#   ./scripts/notarize.sh --upload vX.Y.Z   # build, sign, notarize, verify, gh release upload
#
# CI only creates a draft release (with generated notes, no binary) on tag push,
# so a non-notarized macOS binary can never end up attached to a GitHub release.
#
# Windows is the exception: its build is unsigned by design (docs/windows.md) and is attached to
# the DRAFT release (portable zip, installer, SHA256SUMS), so the maintainer sees it before publishing.

on:
  push:
    tags: ["v*"]
  # Fired when the maintainer publishes the (locally notarized) release: sync README + website.
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create draft release (no binary)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            > **Hinweis zu Windows & Android (Frühes Alpha-Stadium):**
            > Die Pakete für **Windows** (`girocrab-windows-x86_64-setup.exe` / `.zip`) und **Android** (`GiroCrab-Android-alpha.apk`) befinden sich noch in einem frühen Entwicklungsstadium (Alpha). Funktionsumfang, Oberfläche und Sicherheitshärtung entsprechen noch **nicht** der signierten & notarisierten macOS-Version (`GiroCrab-macOS-arm64.dmg`). Bitte nutzt diese Vorab-Builds nur zum Ausprobieren (idealerweise im Demo-Modus oder mit einem Test-Tresor).

  windows-package:
    needs: draft-release
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: GiroCrabWindows
      - name: Build
        run: cargo build --release --locked --manifest-path GiroCrabWindows/Cargo.toml
      - name: Package portable zip + installer
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: ./scripts/package-windows.ps1 -Version "$env:TAG_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: girocrab-windows-x86_64
          path: dist/*
          if-no-files-found: error
      - name: Attach to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG_NAME" dist/girocrab-windows-x86_64.zip dist/girocrab-windows-x86_64-setup.exe dist/SHA256SUMS.txt --clobber --repo "$REPO"

  android-package:
    needs: draft-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android Alpha APK
        working-directory: GiroCrabAndroid
        run: gradle assembleDebug --console=plain --stacktrace
      - name: Prepare Alpha Asset
        run: |
          mkdir -p dist
          APK_SRC=$(ls GiroCrabAndroid/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK_SRC" dist/GiroCrab-Android-alpha.apk
      - uses: actions/upload-artifact@v4
        with:
          name: girocrab-android-alpha
          path: dist/GiroCrab-Android-alpha.apk
          if-no-files-found: error
      - name: Attach Alpha APK to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG_NAME" dist/GiroCrab-Android-alpha.apk --clobber --repo "$REPO"

  linux-debian-package:
    name: Linux .deb (Debian 13 ${{ matrix.arch }})
    needs: draft-release
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 60
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config \
            dpkg-dev perl libdbus-1-dev qt6-base-dev qt6-declarative-dev qt6-declarative-private-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-shapes qml6-module-qtquick-dialogs qml6-module-qt-labs-qmlmodels \
            qml6-module-qtcore qml6-module-org-kde-kirigami
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: GiroCrabLinux
          key: debian-${{ matrix.arch }}
      - name: Build .deb
        working-directory: GiroCrabLinux
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: DEB_VERSION="${TAG_NAME#v}" ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: girocrab-linux-deb-${{ matrix.arch }}
          path: GiroCrabLinux/target/debian/*.deb
          if-no-files-found: error

  linux-flatpak-package:
    name: Linux Flatpak (${{ matrix.arch }})
    needs: draft-release
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Flatpak-Installation in die beschreibbare Schicht kopieren
        run: |
          cp -a /var/lib/flatpak /var/lib/flatpak.rw
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.rw /var/lib/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: GiroCrabLinux/packaging/flatpak/de.girocrab.GiroCrab.yml
          bundle: girocrab-linux-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache: true
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('GiroCrabLinux/packaging/flatpak/**') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: girocrab-linux-flatpak-${{ matrix.arch }}
          path: girocrab-linux-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  linux-release-attach:
    needs: [draft-release, linux-debian-package, linux-flatpak-package]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: girocrab-linux-*
          path: dist-linux
          merge-multiple: true
      - name: Checksums & attach Linux packages to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd dist-linux
          sha256sum *.deb *.flatpak > SHA256SUMS-linux.txt
          gh release upload "$TAG_NAME" *.deb *.flatpak SHA256SUMS-linux.txt --clobber --repo "$REPO"

  sync-docs-website:
    # Stable releases only. README goes through a PR (main is protected); the website is pushed to
    # GiroCrab/girocrab.de with WEBSITE_DEPLOY_TOKEN (docs/docs-website-sync.md). No token => website skipped.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN || github.token }}
      WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure git push auth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - name: Sync README and girocrab.de
        # The tag name goes in through the environment, not into the script text: this step
        # holds the website deploy token, and a tag name is attacker-chosen text for anyone
        # who can push a tag.
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: scripts/sync-docs-and-website.sh --push --version "$TAG_NAME"
