name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

# Neuer Push auf denselben PR bricht den laufenden Lauf ab (macOS-Runner sind knapp).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `rust` und `swift` laufen bewusst parallel und unabhängig: ein roter
  # fmt-/Clippy-/Rust-Test-Lauf darf den Swift-Build nicht verdecken und umgekehrt.
  # Die Jobnamen bleiben unverändert, damit bestehende Required Checks weiter greifen.
  rust:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --all -- --check
      - name: Keine FinTS-Produkt-ID im Repo
        run: scripts/fints-registrierung.sh scan
      - name: THIRD_PARTY_NOTICES.md deckt alle direkten Abhängigkeiten ab
        run: scripts/check-third-party-notices.sh
      - name: Kein Vault-Zugriff aus Views (nur über AppModel)
        run: scripts/lint-vault-access.sh
      - name: AppModel-Interna nur in AppModel*.swift
        run: scripts/lint-appmodel-internals.sh
      - name: String Catalogs sortiert (scripts/xcstrings.py format)
        run: scripts/xcstrings.py check
      - name: Test String-Catalog-Merge-Driver
        run: python3 -m unittest scripts/test_xcstrings.py scripts/test_sync_docs.py
      - name: Test FNZ portal browser scripts
        run: node --test scripts/test-fnz-portal.cjs scripts/test-quirion-portal.cjs
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  swift:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build Rust core + UniFFI bindings (macOS only)
        run: ./build-xcframework.sh --macos-only
      - name: Stale-bindings check (build-xcframework.sh --check)
        run: |
          ./build-xcframework.sh --check
          echo '// stale' >> girocrab-core/src/text.rs
          if ./build-xcframework.sh --check; then echo "--check missed a core change" >&2; exit 1; fi
          git checkout -- girocrab-core/src/text.rs
          ./build-xcframework.sh --check
      - name: Build SwiftUI app
        run: cd GiroCrabApp && swift build
      - name: Test SwiftUI app
        run: cd GiroCrabApp && swift test
