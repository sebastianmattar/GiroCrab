name: CI

# One workflow for everything: core + Swift app (macOS), Windows front end, Linux port
# (Qt / Debian) and the Flatpak. The `changes` job decides per job which parts of the
# repository a PR touches, so a PR only pays for what it can affect. The Linux port is
# community-maintained and follows the SwiftUI app asynchronously (#389): its jobs run
# independently of the Mac jobs and never wait for them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly: new advisories appear without any change in this repository.
  schedule:
    - cron: "0 5 * * 1"

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  # No debug info in CI: it costs link time (slow on Windows) and a large share of the Rust
  # caches (the repository's 10 GB Actions cache was full, so caches of `main` got evicted and
  # PRs rebuilt every dependency from scratch). Panic messages keep file and line.
  CARGO_PROFILE_DEV_DEBUG: 0

# Neuer Push auf denselben PR bricht den laufenden Lauf ab (macOS-Runner sind knapp).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts changed. A push to main compares with the previous head, a PR with its base;
  # manual runs and anything unclear run everything. The jobs below always report (they are
  # skipped, not missing), and only the expensive ones depend on the flags. The cheap lint
  # steps of `rust` (fonts, brand names, catalogs, ...) also guard Swift and docs, so they
  # always run.
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      swift: ${{ steps.f.outputs.swift }}
      macos-local-api: ${{ steps.f.outputs.macos_local_api }}
      windows-core: ${{ steps.f.outputs.windows_core }}
      windows-app: ${{ steps.f.outputs.windows_app }}
      windows-pkg: ${{ steps.f.outputs.windows_pkg }}
      linux: ${{ steps.f.outputs.linux }}
      flatpak: ${{ steps.f.outputs.flatpak }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          files=""; all=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD") && all=false
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            # A force-push can leave the old head unavailable: then run everything.
            files=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null) && all=false
          fi
          # touched <ERE>: some changed file matches (here-string, not a pipe: with
          # `pipefail` an early-exiting `grep -q` would turn a match into a failure)
          touched() { grep -qE "$1" <<<"$files"; }
          # core_touched: girocrab-core/ changed beyond Markdown files
          core_touched() {
            local c
            c=$(grep -E '^girocrab-core/' <<<"$files" | grep -vE '\.md$' || true)
            [ -n "$c" ]
          }
          flag() { # flag <name> <condition>
            if [ "$all" = true ] || eval "$2"; then echo "$1=true"; else echo "$1=false"; fi
          }
          ci='^\.github/workflows/ci\.yml$'
          workspace='^(Cargo\.(toml|lock)|build-xcframework\.sh)$'
          {
            # Rust core, MCP adapter, helper crates, workspace manifests, CI itself
            flag rust "core_touched || touched '^(girocrab-mcp/|uniffi-bindgen/|tools/)|$workspace|$ci'"
            # Swift app, the core behind it (bindings), CI itself
            flag swift "core_touched || touched '^GiroCrabApp/|$workspace|$ci'"
            # macOS-only branches of the core (peer credentials of the local socket in sys.rs, MCP socket path)
            flag macos_local_api "touched '^(girocrab-core/src/(local_api|sys\.rs)|girocrab-mcp/)|$ci'"
            # Core tests on Windows: only the core itself can break them
            flag windows_core "core_touched || touched '^Cargo\.(toml|lock)$|$ci'"
            # Windows front end (also builds the core)
            flag windows_app "core_touched || touched '^(GiroCrabWindows/|Cargo\.(toml|lock))|$ci'"
            # Windows release build + installer (2-10 min): only for the front end or its packaging
            flag windows_pkg "touched '^(GiroCrabWindows/|scripts/package-windows\.ps1$)|$ci'"
            # Linux port (Qt, Debian): its sources, the core and the shared string catalog
            flag linux "core_touched || touched '^GiroCrabLinux/|Localizable\.xcstrings$|$ci'"
            # Flatpak: packaging and dependencies; core sources are built by the Debian job
            flag flatpak "touched '^(GiroCrabLinux/|girocrab-core/Cargo\.toml$)|$ci'"
          } >> "$GITHUB_OUTPUT"

  # Known vulnerabilities / unmaintained crates in Cargo.lock (RustSec). Warnings fail the job;
  # accepted exceptions live in `.cargo/audit.toml` with a reason.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Prebuilt binary instead of `cargo install` (compiling it took 2.5-3 min on every run).
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings

  # `rust` and `swift` deliberately run in parallel and independently: a red
  # fmt/Clippy/Rust test run must not hide the Swift build, and vice versa.
  # The job names stay unchanged so existing required checks keep matching.
  # Runs on Linux: the core is portable (the Linux and Windows front ends build it too), the
  # lint scripts are plain bash/awk/grep, and Linux runners are cheap and plentiful. The
  # macOS-only branches of the core are covered by a targeted test step in `swift`.
  rust:
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # Only main writes the cache; PRs restore it. Otherwise every PR branch saves its own
      # gigabyte-sized copy and evicts the cache of main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --all -- --check
      - name: No FinTS product ID in the repo
        run: scripts/fints-registrierung.sh scan
      - name: THIRD_PARTY_NOTICES.md covers all direct dependencies
        run: scripts/check-third-party-notices.sh
      - name: No vault access from views (only via AppModel)
        run: scripts/lint-vault-access.sh
      - name: AppModel internals only in AppModel*.swift
        run: scripts/lint-appmodel-internals.sh
      - name: Text styles via .appFont (scale with the text size)
        run: scripts/lint-fonts.sh
      - name: No macOS-only APIs outside #if os(macOS) (iOS build)
        run: scripts/lint-ios-compat.sh
      - name: No third-party software brands in user-visible texts
        run: scripts/lint-brand-names.sh
      - name: Sheets and popovers captured by the bug report (redacted)
        run: scripts/lint-report-dialogs.sh
      - name: Swift tests with UserDefaults.standard marked serial, unique suite names
        run: scripts/lint-test-defaults.sh
      - name: String catalogs sorted (scripts/xcstrings.py format)
        run: scripts/xcstrings.py check
      # A Mac PR that renames or drops a catalog key the Linux UI still uses leaves Linux
      # without English (#687, #693); fail here, not only in the path-filtered Linux job.
      - name: Linux UI texts have English (Localizable.xcstrings or i18n/en-linux.json)
        run: python3 -I GiroCrabLinux/scripts/i18n-report.py
      - name: Test String-Catalog-Merge-Driver
        run: python3 -m unittest scripts/test_xcstrings.py scripts/test_sync_docs.py
      - name: Test AI provenance classifier
        run: python3 -m unittest tools/test_export_ai_provenance.py
      - name: Test FNZ portal browser scripts
        run: node --test scripts/test-fnz-portal.cjs scripts/test-quirion-portal.cjs scripts/test-schwaebisch-hall-portal.cjs scripts/test-advanzia-portal.cjs scripts/test-equateplus-linux.cjs
      - name: FFI types carry the optional serde derive (front ends without UniFFI)
        run: scripts/lint-serde-feature.sh
      - name: Free functions are exported to UniFFI only from ffi.rs
        run: scripts/lint-ffi-exports.sh
      - name: No unsafe outside sys.rs, no processes, hidden includes or encoded data in the payment path
        run: scripts/lint-no-obfuscation.sh
      - if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: girocrab-core builds with the optional serde feature
        if: needs.changes.outputs.rust == 'true'
        run: cargo check -p girocrab-core --features serde
      # Both builds that ship: default features (the Swift app) and serde (Linux); the
      # serde one is up to date after the step above.
      - name: The core library contains only its sources and data tables (no test files, no unlisted env)
        if: needs.changes.outputs.rust == 'true'
        run: |
          scripts/lint-no-obfuscation.sh --compiled
          scripts/lint-no-obfuscation.sh --compiled --features serde
      - name: Install cargo-nextest
        if: needs.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - if: needs.changes.outputs.rust == 'true'
        run: cargo nextest run --workspace

  # Windows MVP: the core must build and pass its tests on MSVC (Unix-only code such as the
  # local API socket is gated with cfg(unix)). SQLCipher links a vendored OpenSSL, so a cold
  # build is slow; the cache of main keeps PR runs short.
  windows-core:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.windows-core == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --manifest-path girocrab-core/Cargo.toml

  # GiroCrabWindows: Slint front end on the core (own workspace). Also checked on Linux to keep
  # the cross-platform fallback (no Credential Manager) building.
  windows-app:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.windows-app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: GiroCrabWindows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - run: cargo test --manifest-path GiroCrabWindows/Cargo.toml
      - if: runner.os == 'Windows' && needs.changes.outputs.windows-pkg == 'true'
        run: cargo build --release --manifest-path GiroCrabWindows/Cargo.toml
      - if: runner.os == 'Windows' && needs.changes.outputs.windows-pkg == 'true'
        name: Package portable zip + installer
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - if: runner.os == 'Windows' && needs.changes.outputs.windows-pkg == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: girocrab-windows-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  swift:
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache prebuilt macOS XCFramework + UniFFI bindings
        if: needs.changes.outputs.swift == 'true'
        id: xcf-cache
        uses: actions/cache@v4
        with:
          path: |
            GiroCrabApp/GiroCrabCore.xcframework
            GiroCrabApp/Sources/GiroCrabCore
          key: xcf-macos-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build-xcframework.sh', 'girocrab-core/**', 'uniffi-bindgen/**') }}
      - if: needs.changes.outputs.swift == 'true' && (steps.xcf-cache.outputs.cache-hit != 'true' || needs.changes.outputs.rust == 'true')
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - if: needs.changes.outputs.swift == 'true' && (steps.xcf-cache.outputs.cache-hit != 'true' || needs.changes.outputs.rust == 'true')
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Rust core + UniFFI bindings (macOS only)
        if: needs.changes.outputs.swift == 'true' && steps.xcf-cache.outputs.cache-hit != 'true'
        run: ./build-xcframework.sh --macos-only
      - name: Stale-bindings check (build-xcframework.sh --check)
        # Needs the bindings built above, which only exist when the Swift part runs
        # (a change only to girocrab-mcp/ or tools/ sets `rust` alone).
        if: needs.changes.outputs.swift == 'true' && needs.changes.outputs.rust == 'true'
        run: |
          ./build-xcframework.sh --check
          echo '// stale' >> girocrab-core/src/text.rs
          if ./build-xcframework.sh --check; then echo "--check missed a core change" >&2; exit 1; fi
          git checkout -- girocrab-core/src/text.rs
          ./build-xcframework.sh --check
      # The `rust` job tests on Linux; the macOS branches of the local API socket (peer
      # credentials) only run here.
      - name: Core tests of macOS-specific code (local API)
        if: needs.changes.outputs.swift == 'true' && needs.changes.outputs.macos-local-api == 'true'
        run: cargo test -p girocrab-core --lib local_api
      - name: Build & Test SwiftUI app (parallel + serial-defaults)
        if: needs.changes.outputs.swift == 'true'
        run: scripts/swift-test-split.sh

  # ---------------------------------------------------------------------------------------
  # Linux port (GiroCrabLinux/, Qt 6 / QML).
  # ---------------------------------------------------------------------------------------

  # The oldest Qt the port supports. Qt 6.6 is needed for font.features (tabular figures)
  # and the curve renderer of Qt Quick Shapes. Official Qt builds for Linux arm64 start
  # at 6.7, so this job runs on x86_64 only.
  qt-minimum:
    name: Qt 6.6 (Mindestversion, x86_64)
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # tests never touch a real keyring / Secret Service
      GIROCRAB_NO_KEYCHAIN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libxkbcommon-dev libdbus-1-dev pkg-config
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          modules: 'qtwebengine qtwebchannel qtpositioning qtpdf'
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: GiroCrabLinux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every UI text needs English (Localizable.xcstrings or i18n/en-linux.json).
      - name: English UI texts
        working-directory: GiroCrabLinux
        run: python3 -I scripts/i18n-report.py
      - name: cargo fmt
        working-directory: GiroCrabLinux
        run: cargo fmt -- --check
      - name: cargo clippy
        working-directory: GiroCrabLinux
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: GiroCrabLinux
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/data" XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          cargo test

  # What users install: Debian 13 with Qt from the distribution, on x86_64 and arm64.
  # Also builds the .deb package (uploaded as a workflow artifact, not released).
  debian:
    name: Debian 13 (${{ matrix.arch }})
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        # arm64 (the slowest job, ~19 min) only on main / manual runs; PRs build amd64.
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"runner":"ubuntu-24.04","arch":"amd64"}]'
          || '[{"runner":"ubuntu-24.04","arch":"amd64"},{"runner":"ubuntu-24.04-arm","arch":"arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 60
    env:
      GIROCRAB_NO_KEYCHAIN: '1'
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config \
            dpkg-dev perl libdbus-1-dev qt6-base-dev qt6-declarative-dev qt6-declarative-private-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-shapes qml6-module-qtquick-dialogs qml6-module-qt-labs-qmlmodels \
            qml6-module-qtcore qml6-module-org-kde-kirigami
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: GiroCrabLinux
          key: debian-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        working-directory: GiroCrabLinux
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: GiroCrabLinux
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/data" XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          cargo test
      - name: Build .deb
        working-directory: GiroCrabLinux
        run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: girocrab-debian13-${{ matrix.arch }}
          path: GiroCrabLinux/target/debian/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # Flatpak of the Linux port (GiroCrabLinux/packaging/flatpak/): a .flatpak bundle per
  # architecture as a workflow artifact, for Fedora, openSUSE, Arch and other distributions
  # without a .deb. Nothing is published (no Flathub, no release).
  # ---------------------------------------------------------------------------------------

  # The offline crate list must match GiroCrabLinux/Cargo.lock, otherwise the build below
  # fails with a missing crate (or silently keeps an old version).
  flatpak-cargo-sources:
    name: cargo-sources.json aktuell
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.flatpak == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generator dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'aiohttp>=3.9.5,<4' 'PyYAML>=6.0.2,<7' 'tomlkit>=0.13.3,<1'
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Compare with Cargo.lock
        run: GiroCrabLinux/packaging/flatpak/update-cargo-sources.sh --check

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.flatpak == 'true'
    strategy:
      fail-fast: false
      matrix:
        # aarch64 only on main / manual runs; PRs build x86_64.
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"runner":"ubuntu-24.04","arch":"x86_64"}]'
          || '[{"runner":"ubuntu-24.04","arch":"x86_64"},{"runner":"ubuntu-24.04-arm","arch":"aarch64"}]') }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The image ships the KDE runtimes preinstalled; updating them renames directories of
      # the image's lower overlayfs layer, which fails with "Invalid cross-device link"
      # (seen on the x86_64 runners). A full copy lives in the writable layer.
      - name: Flatpak-Installation in die beschreibbare Schicht kopieren
        run: |
          cp -a /var/lib/flatpak /var/lib/flatpak.rw
          rm -rf /var/lib/flatpak
          mv /var/lib/flatpak.rw /var/lib/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: GiroCrabLinux/packaging/flatpak/de.girocrab.GiroCrab.yml
          bundle: girocrab.flatpak
          arch: ${{ matrix.arch }}
          cache: true
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('GiroCrabLinux/packaging/flatpak/**') }}
          upload-artifact: true
