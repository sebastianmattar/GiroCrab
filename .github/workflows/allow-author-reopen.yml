name: Allow Issue Author to Reopen

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  reopen:
    if: >
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'closed' &&
      github.event.comment.user.login == github.event.issue.user.login &&
      (contains(github.event.comment.body, '/reopen') ||
       contains(github.event.comment.body, 'wieder öffnen') ||
       contains(github.event.comment.body, 'reopen'))
    runs-on: ubuntu-latest
    steps:
      - name: Reopen Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue reopen "${{ github.event.issue.number }}" --repo "${{ github.repository }}"
