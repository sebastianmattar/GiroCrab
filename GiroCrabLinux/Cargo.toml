[package]
name = "girocrab-linux"
# Kept equal to [workspace.package] in ../Cargo.toml; the app itself reads that one (build.rs).
version = "0.8.7"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/GiroCrab/GiroCrab"
description = "GiroCrab for Linux: Qt6/QML front end on the GiroCrab Rust core"

# Own workspace: the macOS CI (`cargo clippy --workspace`) must not need Qt.
[workspace]

[[bin]]
name = "girocrab"
path = "src/main.rs"

[dependencies]
girocrab-core = { path = "../girocrab-core", features = ["serde"] }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde = "1"
serde_json = "1"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
base64 = "0.22"
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
ed25519-dalek = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# ZUGFeRD XML embedded in dropped PDF invoices (already used by girocrab-core).
miniz_oxide = "0.9"
# Local time of the Abrufprotokoll lines in a bug report (already used by girocrab-core).
jiff = "1.0.1"
rqrr = { version = "0.11", default-features = false }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
# Reads the Mac app's string catalog for the English UI (i18n, build.rs).
serde_json = "1"
