[package]
name = "girocrab-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "GiroCrab core: encrypted ledger, categorisation rules and bank connectors (UniFFI)"

[lib]
name = "girocrab_core"
crate-type = ["lib", "staticlib", "cdylib"]

# `unsafe` only in src/sys.rs, the one file that lifts this (#948). Not the
# workspace's `forbid`: that could not be lifted there.
[lints.rust]
unsafe_code = "deny"

[features]
# JSON (de)serialisation of the FFI records, for front ends without UniFFI
# bindings (GiroCrabLinux). Off for the Swift app.
serde = []

[dependencies]
uniffi = { version = "0.32", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
zeroize = { version = "1.9", features = ["zeroize_derive"] }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "cookies", "query"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
base64 = "0.22"
rsa = { version = "0.10", features = ["encoding", "getrandom", "pkcs1v15", "hazmat"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
p256 = { version = "0.14", features = ["ecdsa"] }
sha2 = "0.11"
aes = { version = "0.9", features = ["zeroize"] }
cbc = { version = "0.2", features = ["alloc", "zeroize"] }
des = { version = "0.9", features = ["zeroize"] } # required by FinTS RDH/RAH-10 key files; never used for vault encryption
hmac = { version = "0.13", features = ["zeroize"] }
pbkdf2 = "0.13"
crypto-primes = { version = "0.7", default-features = false }
sha1 = "0.11"
jiff = "1.0.1"
rand = "0.9"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
url = "2"
simpleicons-rs = "16"
miniz_oxide = "0.9.1"
# GiroCode (EPC QR) matrix for every front end (#663).
qrcode = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Android keeps its zone data in an APEX path jiff does not search, so without
# the bundled copy "today" would silently be the UTC date there.
[target.'cfg(target_os = "android")'.dependencies]
jiff = { version = "1.0.1", features = ["tzdb-bundle-always"] }

[dev-dependencies]
# Independent XML parser for the payment invariant tests (#947); tests only.
roxmltree = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
