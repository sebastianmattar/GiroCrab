[package]
name = "girocrab-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GiroCrab core: encrypted ledger, categorisation rules and bank connectors (UniFFI)"

[lib]
name = "girocrab_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = { version = "0.32", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = { version = "2.7", default-features = false }
zeroize = { version = "1.9", features = ["zeroize_derive"] }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "cookies", "query"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
base64 = "0.22"
rsa = { version = "0.10", features = ["encoding", "getrandom", "pkcs1v15"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
p256 = { version = "0.14", features = ["ecdsa"] }
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.9"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
url = "2"
simpleicons-rs = "16"
miniz_oxide = "0.9.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
